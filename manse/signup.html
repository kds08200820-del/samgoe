<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 | 삼일만세운동본부</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b0b" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" />
  <link rel="stylesheet" href="manse.css?v=2" />
</head>
<body>
  <header class="m-bar"><div class="in">
    <a class="m-brand" href="./"><span class="m-badge"><img src="img/logo-192.png" alt="" /></span>삼일만세운동본부</a>
    <span id="mAuth"></span>
  </div></header>

  <main class="m-wrap">
    <div class="m-card">
      <img class="m-logo" src="img/logo-192.png" alt="삼일만세운동본부 로고" />
      <h1 class="m-title">회원가입</h1>
      <p class="m-sub">삼일만세운동본부 회원으로 함께해 주세요</p>
      <div class="m-msg" id="notice"></div>

      <!-- 제휴 단체 연동 (제휴 단체 페이지에서 넘어왔거나, 이 브라우저에 제휴 단체 로그인이 있을 때만 표시) -->
      <section class="link-card" id="linkCard" hidden>
        <div class="lk-h">🤝 삼괴연합회 회원이신가요?</div>
        <p class="lk-p" id="lkText">삼괴연합회 회원 정보(이름·연락처·소속)를 불러와 가입을 간편하게 하고, 두 단체 회원으로 연동해 둘 수 있습니다.</p>
        <div class="lk-row" id="lkBtns">
          <button type="button" class="m-btn gold sm" id="lkUse">회원 연동하기</button>
          <button type="button" class="m-btn ghost sm" id="lkSkip">연동하지 않고 가입</button>
        </div>
        <div class="lk-form" id="lkForm">
          <label class="m-l" for="sgEmail">삼괴연합회 이메일</label>
          <input class="m-in" id="sgEmail" type="email" autocomplete="off" placeholder="삼괴연합회 가입 이메일" />
          <label class="m-l" for="sgPw">삼괴연합회 비밀번호</label>
          <input class="m-in" id="sgPw" type="password" autocomplete="off" placeholder="삼괴연합회 비밀번호" />
          <p class="m-help">확인에만 쓰이며 저장되지 않습니다. 확인 후 연결은 바로 종료됩니다.</p>
          <button type="button" class="m-btn sm" id="lkCheck" style="margin-top:10px">확인하고 정보 불러오기</button>
        </div>
        <div class="lk-done" id="lkDone"></div>
      </section>

      <form id="f" novalidate>
        <label class="m-l" for="name">이름</label>
        <input class="m-in" id="name" required autocomplete="name" placeholder="홍길동" />
        <label class="m-l" for="email">이메일 <span class="opt">(로그인 아이디)</span></label>
        <input class="m-in" id="email" type="email" required autocomplete="email" placeholder="you@example.com" />
        <label class="m-l" for="pw">비밀번호 <span class="opt">(8자 이상)</span></label>
        <input class="m-in" id="pw" type="password" required minlength="8" autocomplete="new-password" />
        <label class="m-l" for="pw2">비밀번호 확인</label>
        <input class="m-in" id="pw2" type="password" required minlength="8" autocomplete="new-password" />
        <label class="m-l" for="phone">연락처 <span class="opt">(선택)</span></label>
        <input class="m-in" id="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000" />
        <label class="m-l" for="church">소속 단체 <span class="opt">(선택)</span></label>
        <input class="m-in" id="church" autocomplete="organization" placeholder="예: ○○마을, ○○단체" />
        <label class="m-check"><input type="checkbox" id="terms" /> <span><a href="terms.html#terms" target="_blank" rel="noopener">이용약관</a>과 <a href="terms.html#privacy" target="_blank" rel="noopener">개인정보처리방침</a>에 동의합니다 (필수)</span></label>
        <div class="m-msg" id="msg"></div>
        <button class="m-btn block" type="submit">가입하기</button>
      </form>
      <div class="m-foot">이미 회원이신가요? <a href="login.html">로그인</a></div>
    </div>
    <a class="m-home" href="./">← 삼일만세운동본부 홈</a>
  </main>

  <footer class="m-footer">© 2026 삼일만세운동본부 · <a href="terms.html#terms">이용약관</a> · <a href="terms.html#privacy">개인정보처리방침</a></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=3"></script>
  <script src="auth.js?v=3"></script>
  <script src="samgoe-link.js?v=1"></script>
  <script>
  (function () {
    var $ = function (id) { return document.getElementById(id); };
    var f = $('f'), msg = $('msg'), notice = $('notice');
    function show(el, cls, t) { el.className = 'm-msg ' + cls; el.textContent = t; }
    if (!window.MANSE_READY) show(notice, 'info', '회원가입 준비 중입니다. (관리자: manse/config.js 설정 필요)');

    // ---------- 제휴 단체 연동 ----------
    var linked = null;   // { uid, email, name, phone, church }
    var card = $('linkCard');
    function fill(info) {
      linked = info;
      if (info.name) $('name').value = info.name;
      if (info.email && !$('email').value) $('email').value = info.email;
      if (info.phone) $('phone').value = info.phone;
      if (info.church) $('church').value = info.church;
      $('lkBtns').style.display = 'none'; $('lkForm').style.display = 'none';
      $('lkText').textContent = '삼괴연합회 회원 정보를 불러왔습니다. 아래 내용을 확인해 주세요.';
      var d = $('lkDone'); d.style.display = 'block';
      d.innerHTML = '✓ 삼괴연합회 회원 <b>' + window.mEsc(info.name || info.email) + '</b>님과 연동하여 가입합니다. <a href="#" id="lkCancel" style="color:var(--muted);font-weight:400;margin-left:6px">연동 취소</a>';
      $('lkCancel').addEventListener('click', function (e) { e.preventDefault(); linked = null; d.style.display = 'none'; $('lkBtns').style.display = 'flex'; $('lkText').textContent = '연동을 취소했습니다. 필요하면 다시 연동할 수 있습니다.'; });
    }
    var sessionInfo = null;
    (async function () {
      sessionInfo = await window.samgoeLink.fromSession();
      if (window.mFromSamgoe() || sessionInfo) {
        card.hidden = false;
        if (sessionInfo) $('lkText').textContent = '이 브라우저에 삼괴연합회 회원 ' + (sessionInfo.name || sessionInfo.email) + '님으로 로그인되어 있습니다. 연동하면 이름·연락처·소속을 불러오고 두 단체 회원으로 연결해 둡니다.';
      }
    })();
    $('lkUse').addEventListener('click', function () {
      if (sessionInfo) { fill(sessionInfo); return; }
      $('lkForm').style.display = 'block'; $('sgEmail').focus();
    });
    $('lkSkip').addEventListener('click', function () { card.hidden = true; });
    $('lkCheck').addEventListener('click', async function () {
      var b = this; msg.className = 'm-msg';
      var em = $('sgEmail').value.trim(), pw = $('sgPw').value;
      if (!em || !pw) { show(msg, 'err', '삼괴연합회 이메일과 비밀번호를 입력해 주세요.'); return; }
      b.disabled = true; b.textContent = '확인 중…';
      try { fill(await window.samgoeLink.withPassword(em, pw)); $('sgPw').value = ''; }
      catch (ex) { show(msg, 'err', (ex && ex.message) || '삼괴연합회 계정을 확인하지 못했습니다.'); }
      b.disabled = false; b.textContent = '확인하고 정보 불러오기';
    });

    // ---------- 가입 ----------
    f.addEventListener('submit', async function (e) {
      e.preventDefault(); msg.className = 'm-msg';
      if (!window.msb) { show(msg, 'err', '회원가입 준비 중입니다.'); return; }
      var name = $('name').value.trim(), email = $('email').value.trim(), pw = $('pw').value, pw2 = $('pw2').value;
      if (!name) return show(msg, 'err', '이름을 입력해 주세요.');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show(msg, 'err', '올바른 이메일을 입력해 주세요.');
      if (pw.length < 8) return show(msg, 'err', '비밀번호는 8자 이상이어야 합니다.');
      if (pw !== pw2) return show(msg, 'err', '비밀번호 확인이 일치하지 않습니다.');
      if (!$('terms').checked) return show(msg, 'err', '이용약관과 개인정보처리방침에 동의해 주세요.');
      var data = { name: name, phone: $('phone').value.trim(), church: $('church').value.trim(), terms_agreed_at: new Date().toISOString() };
      if (linked) { data.samgoe_uid = linked.uid; data.samgoe_email = linked.email; }
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = '가입 처리 중…';
      try {
        var r = await window.msb.auth.signUp({ email: email, password: pw, options: { data: data, emailRedirectTo: window.mUrl('login.html') } });
        if (r.error) throw r.error;
        // 이메일 확인이 꺼져 있으면 바로 로그인 상태
        if (r.data && r.data.session) { location.href = './'; return; }
        // 이미 가입된 이메일은 identities가 비어서 돌아옴(보안상 오류 대신)
        if (r.data && r.data.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length === 0) throw new Error('already registered');
        location.href = 'login.html?joined=1'; return;
      } catch (ex) { show(msg, 'err', window.mErr(ex)); }
      btn.disabled = false; btn.textContent = '가입하기';
    });
  })();
  </script>
</body>
</html>
