<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회계 관리 | 임원방 · 삼괴지역 기독교 연합회</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="ledger.css?v=1" />
  <style>
    :root{--primary:#032257;--ink:#262626;--bodytext:#3c3c3c;--muted:#6b6b6b;--hairline:#e6e3dd;--surface-soft:#f7f5f0;--dark:#0d1d3a;}
    *{box-sizing:border-box;}
    body{margin:0;background:var(--surface-soft);color:var(--bodytext);font-weight:300;word-break:keep-all;
      font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;}
    a{color:inherit;text-decoration:none;}
    .bar{position:sticky;top:0;background:var(--dark);height:44px;display:flex;align-items:center;z-index:20;}
    .bar .in{max-width:1100px;margin:0 auto;width:100%;padding:0 22px;display:flex;align-items:center;justify-content:space-between;}
    .bar .in > a{font-size:13px;font-weight:700;color:rgba(255,255,255,0.92);}
    #authArea{font-size:12px;}
    #loading{padding:80px;text-align:center;color:var(--muted);} #content{display:none;}
    .wrap{max-width:1100px;margin:0 auto;padding:36px 18px 70px;}
    .crumb{font-size:13px;color:var(--muted);margin-bottom:10px;} .crumb a{color:var(--primary);font-weight:600;}
    .title{margin:0;font-size:clamp(24px,4vw,30px);color:var(--ink);}
    .sub{margin:8px 0 22px;font-size:14.5px;color:var(--muted);line-height:1.8;}
    footer{background:var(--dark);color:rgba(255,255,255,0.65);padding:22px;text-align:center;font-size:12px;}
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/theme.css?v=3" />
</head>
<body>
  <header class="bar"><div class="in"><a href="index.html">삼괴지역 기독교 연합회</a><span id="authArea"></span></div></header>
  <div id="loading">확인 중…</div>

  <main class="wrap" id="content">
    <div class="crumb"><a href="officer.html">← 임원방</a> · 회계 관리</div>
    <h1 class="title">회계 관리</h1>
    <p class="sub" id="sub">삼괴지역기독교연합회의 수입 · 지출을 기록하고, 연도 · 달 · 기간별 회계 보고를 인쇄합니다. 삼일만세운동본부 회계와는 따로 관리됩니다.</p>
    <div id="ledger"></div>
  </main>

  <footer>© 2026 삼괴지역 기독교 연합회 · 임원 전용</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=3"></script>
  <script src="auth.js?v=13"></script>
  <script src="ledger.js?v=1"></script>
  <script>
  (async function(){
    // 임원이면 보기 · 인쇄, 회계 · 회장 · 최고관리자는 기록까지 (ledger-setup.sql 의 is_treasurer 와 같은 기준)
    var res = await window.requireOfficer(); if(!res) return;
    var me = res.user, p = res.profile || {};
    var canWrite = window.isSuperAdmin(me) || ['회계','회장'].indexOf(p.officer_role) >= 0;
    document.getElementById('loading').style.display='none'; document.getElementById('content').style.display='block';
    if(!canWrite) document.getElementById('sub').textContent += ' 기록은 회계 · 회장만 할 수 있고, 임원은 보고 인쇄할 수 있습니다.';
    window.Ledger.mount(document.getElementById('ledger'), {
      client: window.sb, org: '삼괴지역기독교연합회', canWrite: canWrite, setupFile: 'ledger-setup.sql',
      signers: ['회계', '감사', '회장'],
      cats: {
        '수입': ['회비', '헌금', '후원금', '찬조금', '행사 참가비', '이자', '기타 수입'],
        '지출': ['행사비', '장학금', '작은교회 후원', '선교 · 구제', '회의비', '식비 · 다과', '사무 · 통신비', '인쇄 · 홍보비', '경조사비', '차량 · 교통비', '기타 지출']
      }
    });
  })();
  </script>
</body>
</html>
